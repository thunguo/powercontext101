<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title description">
  <title id="title">Candidates pass Review first</title>
  <desc id="description">Revise a proposal with Candidate version. Approval creates an Artifact Revision. Reject creates none.</desc>
  <defs>
    <marker id="review-gate-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0 0L10 5L0 10Z" />
    </marker>
  </defs>
  <style>
    .background { fill: #fbfcfe; }
    .frame { fill: none; stroke: #d8dee8; }
    .heading { fill: #040d2b; }
    .accent-text { fill: #006dff; }
    .secondary { fill: #626b7a; }
    .quiet { fill: #8b94a3; }
    .paper { fill: #ffffff; stroke: #cbd3df; }
    .paper-back { fill: #f7f9fc; stroke: #d8dee8; }
    .gate { fill: #eef5ff; stroke: #006dff; }
    .chip { fill: #ffffff; stroke: #cbd3df; }
    .chip-accent { fill: #eef5ff; stroke: #006dff; }
    .flow { fill: none; stroke: #9aa5b4; }
    .arrowhead { fill: #9aa5b4; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .heading { fill: #f0f6fc; }
      .accent-text { fill: #58a6ff; }
      .secondary { fill: #9aa4b2; }
      .quiet { fill: #7d8590; }
      .paper { fill: #161b22; stroke: #3b434d; }
      .paper-back { fill: #0d1117; stroke: #3b434d; }
      .gate { fill: #122033; stroke: #58a6ff; }
      .chip { fill: #161b22; stroke: #3b434d; }
      .chip-accent { fill: #122033; stroke: #58a6ff; }
      .flow { stroke: #66707d; }
      .arrowhead { fill: #66707d; }
    }
  </style>
  <rect class="background" width="1080" height="400" rx="16" />
  <rect class="frame" x="0.5" y="0.5" width="1079" height="399" rx="15.5" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
    <text class="heading" x="48" y="48" font-size="24" font-weight="650">Candidates pass <tspan class="accent-text">Review</tspan> first</text>
    <text class="secondary" x="48" y="74" font-size="13">Revise a proposal with version. Approval creates an Artifact Revision. The two numbers do not match.</text>

    <g transform="translate(48 102)">
      <circle class="accent-text" cx="7" cy="0" r="4" />
      <text class="heading" x="20" y="5" font-size="15" font-weight="600">1  Exact evidence</text>
    </g>
    <g transform="translate(360 102)">
      <circle class="accent-text" cx="7" cy="0" r="4" />
      <text class="heading" x="20" y="5" font-size="15" font-weight="600">2  Proposal versions stack</text>
    </g>
    <g transform="translate(700 102)">
      <circle class="accent-text" cx="7" cy="0" r="4" />
      <text class="heading" x="20" y="5" font-size="15" font-weight="600">3  Terminal states split</text>
    </g>

    <rect class="chip" x="48" y="168" width="220" height="88" rx="10" />
    <text class="heading" x="158" y="206" font-size="14" font-weight="600" text-anchor="middle">Source / Artifact</text>
    <text class="quiet" x="158" y="228" font-size="11" text-anchor="middle">At least one exact ref</text>

    <rect class="paper-back" x="336" y="208" width="220" height="88" rx="10" />
    <text class="quiet" x="446" y="258" font-size="13" text-anchor="middle">Candidate v1</text>
    <text class="quiet" x="446" y="276" font-size="11" text-anchor="middle">Fully replaced</text>
    <rect class="paper" x="324" y="148" width="220" height="88" rx="10" />
    <text class="heading" x="434" y="186" font-size="14" font-weight="600" text-anchor="middle">Candidate v2</text>
    <text class="quiet" x="434" y="208" font-size="11" text-anchor="middle">Current pending proposal</text>

    <circle class="gate" cx="640" cy="210" r="42" stroke-width="2" />
    <text class="heading" x="640" y="206" font-size="13" font-weight="700" text-anchor="middle">Review</text>
    <text class="quiet" x="640" y="224" font-size="10" text-anchor="middle">expected_version</text>

    <rect class="chip-accent" x="780" y="132" width="252" height="80" rx="10" />
    <text class="heading" x="906" y="166" font-size="14" font-weight="600" text-anchor="middle">Approved Artifact</text>
    <text class="quiet" x="906" y="188" font-size="11" text-anchor="middle">family/id@revision</text>
    <rect class="chip" x="780" y="236" width="252" height="80" rx="10" />
    <text class="heading" x="906" y="270" font-size="14" font-weight="600" text-anchor="middle">Rejected Candidate</text>
    <text class="quiet" x="906" y="292" font-size="11" text-anchor="middle">Reason only, no Artifact</text>

    <path class="flow" d="M276 212H316" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#review-gate-en)" />
    <path class="flow" d="M552 196H590" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#review-gate-en)" />
    <path class="flow" d="M682 192C720 168 748 168 772 172" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#review-gate-en)" />
    <path class="flow" d="M682 228C720 260 748 268 772 276" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#review-gate-en)" />
    <text class="quiet" x="640" y="328" font-size="12" text-anchor="middle">Approve goes up. Reject goes down. The wrong version conflicts.</text>
  </g>
</svg>
