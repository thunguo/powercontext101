<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title description">
  <title id="title">先审再留</title>
  <desc id="description">Candidate 先进入 Review。批准后 Experience 可召回；Skill 还要显式导出。</desc>
  <defs>
    <marker id="review-flow-zh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0 0L10 5L0 10Z" />
    </marker>
  </defs>
  <style>
    .background { fill: #fbfcfe; }
    .frame { fill: none; stroke: #d8dee8; }
    .heading { fill: #040d2b; }
    .accent-text { fill: #006dff; }
    .secondary { fill: #626b7a; }
    .quiet { fill: #8b94a3; }
    .chip { fill: #ffffff; stroke: #cbd3df; }
    .chip-accent { fill: #eef5ff; stroke: #006dff; }
    .soft { fill: #f7f9fc; stroke: #cbd3df; }
    .flow { fill: none; stroke: #9aa5b4; }
    .arrowhead { fill: #9aa5b4; }
    .accent-fill { fill: #006dff; }
    .track { fill: #e8edf4; }
    .door { fill: #ffffff; stroke: #cbd3df; }
    .vault { fill: #eef5ff; stroke: #006dff; }
    .chrome { fill: #f7f9fc; stroke: #cbd3df; }
    .dot-a { fill: #ff5f57; }
    .dot-b { fill: #febc2e; }
    .dot-c { fill: #28c840; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .heading { fill: #f0f6fc; }
      .accent-text { fill: #58a6ff; }
      .secondary { fill: #9aa4b2; }
      .quiet { fill: #7d8590; }
      .chip { fill: #161b22; stroke: #3b434d; }
      .chip-accent { fill: #122033; stroke: #58a6ff; }
      .soft { fill: #0d1117; stroke: #3b434d; }
      .flow { stroke: #66707d; }
      .arrowhead { fill: #66707d; }
      .accent-fill { fill: #58a6ff; }
      .track { fill: #21262d; }
      .door { fill: #161b22; stroke: #3b434d; }
      .vault { fill: #122033; stroke: #58a6ff; }
      .chrome { fill: #161b22; stroke: #3b434d; }
    }
</style>
  <rect class="background" width="1080" height="400" rx="16" />
  <rect class="frame" x="0.5" y="0.5" width="1079" height="399" rx="15.5" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
    <text class="heading" x="48" y="48" font-size="24" font-weight="650">先审<tspan class="accent-text">再留</tspan></text>
    <text class="secondary" x="48" y="74" font-size="13">模型写得好不好不是重点。先核对精确证据和 Candidate 版本。</text>
    <rect class="chip" x="120" y="118" width="220" height="64" rx="8" />
    <text class="heading" x="230" y="144" font-size="14" font-weight="600" text-anchor="middle">Source 证据</text>
    <text class="quiet" x="230" y="164" font-size="11" text-anchor="middle">先采一条结果</text>
    <path class="flow" d="M348 150H430" stroke-width="1.6" marker-end="url(#review-flow-zh)" />
    <rect class="chip" x="438" y="118" width="220" height="64" rx="8" />
    <text class="heading" x="548" y="144" font-size="14" font-weight="600" text-anchor="middle">Candidate</text>
    <text class="quiet" x="548" y="164" font-size="11" text-anchor="middle">还没批准</text>
    <path class="flow" d="M548 182V214" stroke-width="1.6" marker-end="url(#review-flow-zh)" />
    <rect class="chip-accent" x="438" y="220" width="220" height="72" rx="8" />
    <text class="heading" x="548" y="250" font-size="14" font-weight="700" text-anchor="middle">Review</text>
    <text class="quiet" x="548" y="270" font-size="11" text-anchor="middle">过期会 409</text>
    <path class="flow" d="M438 256C360 256 300 292 300 312" stroke-width="1.6" marker-end="url(#review-flow-zh)" />
    <path class="flow" d="M658 256C736 256 796 292 796 312" stroke-width="1.6" marker-end="url(#review-flow-zh)" />
    <rect class="chip" x="190" y="318" width="220" height="56" rx="8" />
    <text class="heading" x="300" y="340" font-size="13" font-weight="600" text-anchor="middle">Experience</text>
    <text class="quiet" x="300" y="358" font-size="11" text-anchor="middle">批准后可召回</text>
    <rect class="chip-accent" x="686" y="318" width="220" height="56" rx="8" />
    <text class="heading" x="796" y="340" font-size="13" font-weight="600" text-anchor="middle">Skill</text>
    <text class="quiet" x="796" y="358" font-size="11" text-anchor="middle">还要显式导出</text>
  </g>
</svg>
