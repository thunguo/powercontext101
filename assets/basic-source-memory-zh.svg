<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title description">
  <title id="title">两条路都能留下 Memory</title>
  <desc id="description">显式写入保存你已确认的内容；抽取先保存 Source，而且可能不产生 Memory。</desc>
  <defs>
    <marker id="source-memory-zh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0 0L10 5L0 10Z" />
    </marker>
  </defs>
  <style>
    .background { fill: #fbfcfe; }
    .frame { fill: none; stroke: #d8dee8; }
    .heading { fill: #040d2b; }
    .accent-text { fill: #006dff; }
    .secondary { fill: #626b7a; }
    .quiet { fill: #8b94a3; }
    .chip { fill: #ffffff; stroke: #cbd3df; }
    .chip-accent { fill: #eef5ff; stroke: #006dff; }
    .soft { fill: #f7f9fc; stroke: #cbd3df; }
    .flow { fill: none; stroke: #9aa5b4; }
    .arrowhead { fill: #9aa5b4; }
    .accent-fill { fill: #006dff; }
    .track { fill: #e8edf4; }
    .door { fill: #ffffff; stroke: #cbd3df; }
    .vault { fill: #eef5ff; stroke: #006dff; }
    .chrome { fill: #f7f9fc; stroke: #cbd3df; }
    .dot-a { fill: #ff5f57; }
    .dot-b { fill: #febc2e; }
    .dot-c { fill: #28c840; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .heading { fill: #f0f6fc; }
      .accent-text { fill: #58a6ff; }
      .secondary { fill: #9aa4b2; }
      .quiet { fill: #7d8590; }
      .chip { fill: #161b22; stroke: #3b434d; }
      .chip-accent { fill: #122033; stroke: #58a6ff; }
      .soft { fill: #0d1117; stroke: #3b434d; }
      .flow { stroke: #66707d; }
      .arrowhead { fill: #66707d; }
      .accent-fill { fill: #58a6ff; }
      .track { fill: #21262d; }
      .door { fill: #161b22; stroke: #3b434d; }
      .vault { fill: #122033; stroke: #58a6ff; }
      .chrome { fill: #161b22; stroke: #3b434d; }
    }
</style>
  <rect class="background" width="1080" height="380" rx="16" />
  <rect class="frame" x="0.5" y="0.5" width="1079" height="379" rx="15.5" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
    <text class="heading" x="48" y="48" font-size="24" font-weight="650">两条路都能留下<tspan class="accent-text"> Memory</tspan></text>
    <text class="secondary" x="48" y="74" font-size="13">前提、证据链和失败方式不一样。不要混成一条路。</text>
    <rect class="soft" x="72" y="104" width="420" height="236" rx="24" />
    <rect class="soft" x="588" y="104" width="420" height="236" rx="24" />
    <text class="heading" x="88" y="130" font-size="14" font-weight="600">1  直接写下</text>
    <text class="heading" x="604" y="130" font-size="14" font-weight="600">2  先采集再抽取</text>
    <path class="flow" d="M540 150V280" stroke-width="1.4" stroke-dasharray="3 6" />
    <text class="quiet" x="540" y="364" font-size="12" text-anchor="middle">两条管道不混用</text>
    <path class="flow" d="M282 212V226" stroke-width="2.4" stroke-linecap="round" />
    <rect class="chip" x="162" y="156" width="240" height="52" rx="26" />
    <text class="heading" x="282" y="178" font-size="13" font-weight="600" text-anchor="middle">remember_memory</text>
    <text class="quiet" x="282" y="196" font-size="11" text-anchor="middle">不需要模型</text>
    <rect class="chip-accent" x="162" y="230" width="240" height="52" rx="26" />
    <text class="heading" x="282" y="252" font-size="13" font-weight="600" text-anchor="middle">Memory</text>
    <text class="quiet" x="282" y="270" font-size="11" text-anchor="middle">你已经确认</text>
    <path class="flow" d="M798 200V210" stroke-width="2.4" stroke-linecap="round" />
    <path class="flow" d="M798 266V276" stroke-width="2.4" stroke-linecap="round" />
    <rect class="chip" x="678" y="148" width="240" height="52" rx="26" />
    <text class="heading" x="798" y="170" font-size="13" font-weight="600" text-anchor="middle">Source</text>
    <text class="quiet" x="798" y="188" font-size="11" text-anchor="middle">这件事发生过</text>
    <rect class="chip" x="678" y="214" width="240" height="52" rx="26" />
    <text class="heading" x="798" y="236" font-size="13" font-weight="600" text-anchor="middle">flush_memory</text>
    <text class="quiet" x="798" y="254" font-size="11" text-anchor="middle">需要生成模型</text>
    <rect class="chip-accent" x="678" y="280" width="240" height="52" rx="26" />
    <text class="heading" x="798" y="302" font-size="13" font-weight="600" text-anchor="middle">Memory</text>
    <text class="quiet" x="798" y="320" font-size="11" text-anchor="middle">可能没有留下</text>
  </g>
</svg>
