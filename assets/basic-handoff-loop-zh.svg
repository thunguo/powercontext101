<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title description">
  <title id="title">一次真正的交接</title>
  <desc id="description">准备就会写边界 Source。不提交就还是临时包。</desc>
  <defs>
    <marker id="handoff-loop-zh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0 0L10 5L0 10Z" />
    </marker>
  </defs>
  <style>
    .background { fill: #fbfcfe; }
    .frame { fill: none; stroke: #d8dee8; }
    .heading { fill: #040d2b; }
    .accent-text { fill: #006dff; }
    .secondary { fill: #626b7a; }
    .quiet { fill: #8b94a3; }
    .chip { fill: #ffffff; stroke: #cbd3df; }
    .chip-accent { fill: #eef5ff; stroke: #006dff; }
    .soft { fill: #f7f9fc; stroke: #cbd3df; }
    .flow { fill: none; stroke: #9aa5b4; }
    .arrowhead { fill: #9aa5b4; }
    .accent-fill { fill: #006dff; }
    .track { fill: #e8edf4; }
    .door { fill: #ffffff; stroke: #cbd3df; }
    .vault { fill: #eef5ff; stroke: #006dff; }
    .chrome { fill: #f7f9fc; stroke: #cbd3df; }
    .dot-a { fill: #ff5f57; }
    .dot-b { fill: #febc2e; }
    .dot-c { fill: #28c840; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .heading { fill: #f0f6fc; }
      .accent-text { fill: #58a6ff; }
      .secondary { fill: #9aa4b2; }
      .quiet { fill: #7d8590; }
      .chip { fill: #161b22; stroke: #3b434d; }
      .chip-accent { fill: #122033; stroke: #58a6ff; }
      .soft { fill: #0d1117; stroke: #3b434d; }
      .flow { stroke: #66707d; }
      .arrowhead { fill: #66707d; }
      .accent-fill { fill: #58a6ff; }
      .track { fill: #21262d; }
      .door { fill: #161b22; stroke: #3b434d; }
      .vault { fill: #122033; stroke: #58a6ff; }
      .chrome { fill: #161b22; stroke: #3b434d; }
    }
</style>
  <rect class="background" width="1080" height="420" rx="16" />
  <rect class="frame" x="0.5" y="0.5" width="1079" height="419" rx="15.5" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
    <text class="heading" x="48" y="48" font-size="24" font-weight="650">一次真正的<tspan class="accent-text">交接</tspan></text>
    <text class="secondary" x="48" y="74" font-size="13">准备就会写边界 Source。提交才留下里程碑。</text>
    <ellipse class="flow" cx="540" cy="240" rx="360" ry="118" stroke-width="2" stroke-dasharray="5 7" />
    <circle class="chip-accent" cx="540" cy="240" r="46" />
    <text class="heading" x="540" y="236" font-size="12" font-weight="700" text-anchor="middle">提交</text>
    <text class="quiet" x="540" y="254" font-size="11" text-anchor="middle">才持久</text>
    <text class="quiet" x="540" y="392" font-size="12" text-anchor="middle">上半圈可以先临时用。下半圈要显式提交。</text>
    <rect class="chip" x="92" y="140" width="216" height="56" rx="28" />
    <circle class="accent-fill" cx="114" cy="168" r="10" />
    <text x="114" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text class="heading" x="208" y="162" font-size="12" font-weight="600" text-anchor="middle">工作契约</text>
    <text class="quiet" x="208" y="180" font-size="11" text-anchor="middle">委托基线</text>
    <rect class="chip" x="432" y="104" width="216" height="56" rx="28" />
    <circle class="accent-fill" cx="454" cy="132" r="10" />
    <text x="454" y="136" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text class="heading" x="548" y="126" font-size="12" font-weight="600" text-anchor="middle">handoff_current_work</text>
    <text class="quiet" x="548" y="144" font-size="11" text-anchor="middle">会写边界 Source</text>
    <rect class="chip-accent" x="772" y="140" width="216" height="56" rx="28" />
    <circle class="accent-fill" cx="794" cy="168" r="10" />
    <text x="794" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text class="heading" x="888" y="162" font-size="12" font-weight="600" text-anchor="middle">Prepared Handoff</text>
    <text class="quiet" x="888" y="180" font-size="11" text-anchor="middle">可先临时用</text>
    <rect class="chip" x="772" y="284" width="216" height="56" rx="28" />
    <circle class="accent-fill" cx="794" cy="312" r="10" />
    <text x="794" y="316" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text class="heading" x="888" y="306" font-size="12" font-weight="600" text-anchor="middle">commit_handoff</text>
    <text class="quiet" x="888" y="324" font-size="11" text-anchor="middle">持久里程碑</text>
    <rect class="chip" x="432" y="320" width="216" height="56" rx="28" />
    <circle class="accent-fill" cx="454" cy="348" r="10" />
    <text x="454" y="352" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text class="heading" x="548" y="342" font-size="12" font-weight="600" text-anchor="middle">acknowledge exact</text>
    <text class="quiet" x="548" y="360" font-size="11" text-anchor="middle">精确确认</text>
    <rect class="chip-accent" x="92" y="284" width="216" height="56" rx="28" />
    <circle class="accent-fill" cx="114" cy="312" r="10" />
    <text x="114" y="316" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
    <text class="heading" x="208" y="306" font-size="12" font-weight="600" text-anchor="middle">Task Outcome</text>
    <text class="quiet" x="208" y="324" font-size="11" text-anchor="middle">链回这次交接</text>
  </g>
</svg>
